<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindetavler i København</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --ink:#1d2430; --muted:#667085; --line:#e3e6ea; --bg:#fbfaf7; --war:#a3352c; --other:#1f5f8b; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; font:15px/1.4 Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:360px; max-width:100%; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--bg); }
  #map { flex:1; min-height:0; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0 0 2px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; font-family:system-ui,sans-serif; }
  .controls { display:flex; gap:8px; margin-top:10px; }
  input,select { font:14px system-ui,sans-serif; padding:7px 8px; border:1px solid #c9ced6; border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  input { flex:1; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font:13px system-ui,sans-serif; }
  .legend label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); flex:none; }
  #list { overflow:auto; flex:1; }
  .grp { font:600 12px system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:12px 16px 4px; position:sticky; top:0; background:var(--bg); }
  .item { padding:8px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; }
  .item:hover, .item.on { background:#f0ede4; }
  .item .dot { margin-top:5px; }
  .addr { font-weight:600; }
  .txt { font:13px/1.35 system-ui,sans-serif; color:#3b4350; }
  .approx { font:12px system-ui,sans-serif; color:var(--muted); font-style:italic; }
  .leaflet-popup-content { font:13px/1.4 system-ui,sans-serif; margin:12px 14px; }
  .leaflet-popup-content b { font:600 15px Georgia,serif; display:block; margin-bottom:4px; }
  .leaflet-popup-content ul { margin:4px 0 0; padding-left:18px; }
  .leaflet-popup-content li + li { margin-top:8px; }
  .ins { font:13px/1.45 Georgia,serif; margin:6px 0 2px; padding:2px 0 2px 10px; border-left:3px solid var(--line); }
  .ins p { margin:0 0 6px; }
  .ins p:last-child { margin-bottom:0; }
  .leaflet-popup-content a { color:var(--other); }
  footer { padding:8px 16px; border-top:1px solid var(--line); font:12px system-ui,sans-serif; color:var(--muted); }
  footer a { color:inherit; }
  #toggle { display:none; }
  @media (max-width:760px) {
    #app { flex-direction:column-reverse; }
    #side { width:100%; height:46%; border-right:0; border-top:1px solid var(--line); }
    #side.min { height:auto; } #side.min #list, #side.min footer { display:none; }
    #toggle { display:block; position:absolute; right:12px; margin-top:-2px; font:13px system-ui,sans-serif; border:1px solid #c9ced6; background:#fff; border-radius:6px; padding:4px 8px; }
    header { position:relative; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <button id="toggle" type="button">Skjul liste</button>
      <h1>Mindetavler i København</h1>
      <div class="sub"><span id="count"></span></div>
      <div class="controls">
        <input id="q" type="search" placeholder="Søg navn eller adresse" aria-label="Søg">
        <select id="d" aria-label="Bydel"><option value="">Alle bydele</option></select>
      </div>
      <div class="legend">
        <label><input type="checkbox" id="cw" checked><span class="dot" style="background:var(--war)"></span>Besættelsen 1940–45</label>
        <label><input type="checkbox" id="co" checked><span class="dot" style="background:var(--other)"></span>Øvrige</label>
      </div>
    </header>
    <div id="list"></div>
    <footer>{{N}} tavler på {{S}} steder. Kilde: <a href="https://bibliotek.kk.dk/din/bag-om-kobenhavn/mindetavler" target="_blank" rel="noopener">Københavns Biblioteker</a>. Placeringer er geokodet fra adresserne; steder uden husnummer er omtrentlige.<br>Kortet er fremstillet af <a href="https://simplesystemer.dk" target="_blank" rel="noopener">Simple Systemer</a>.</footer>
  </div>
  <div id="map"></div>
</div>
<script>
const DATA = /*DATA*/;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SRC = 'https://bibliotek.kk.dk/din/bag-om-kobenhavn/mindetavler';
const ins = o => o ? '<div class="ins">' + o.split(/\s*\/{2,}\s*/).map(s => '<p>' + esc(s).replace(/\s+\/\s*/g, '<br>') + '</p>').join('') + '</div>' : '';
const tavle = (p, k) => esc(p.t[k]) + ins(p.o[k]);
const map = L.map('map', { zoomControl: true }).setView([55.685, 12.57], 13);
const OSMA = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragydere';
const bases = {
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', { maxZoom: 19, attribution: OSMA }),
  'Esri gadekort': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' }),
  'Esri luftfoto': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' })
};
const names = Object.keys(bases);
let cur = 0;
names.forEach((n, k) => {
  let ok = 0, err = 0;
  bases[n].on('tileload', () => ok++);
  bases[n].on('tileerror', () => {
    err++;
    if (k === cur && ok === 0 && err >= 4 && k < names.length - 2) { map.removeLayer(bases[n]); cur = k + 1; bases[names[cur]].addTo(map); }
  });
});
bases[names[0]].addTo(map);
L.control.layers(bases, null, { position: 'topright' }).addTo(map);
map.on('baselayerchange', e => { cur = names.indexOf(e.name); });
const color = p => p.w ? '#a3352c' : '#1f5f8b';
DATA.forEach((p, i) => {
  p.i = i;
  p.s = (p.a + ' ' + p.t.join(' ') + ' ' + p.o.join(' ') + ' ' + p.d).toLowerCase();
  p.m = L.circleMarker([p.lat, p.lon], { radius: 7, color: '#fff', weight: 2, fillColor: color(p), fillOpacity: p.x ? .55 : .95 });
  p.m.bindPopup('<b>' + esc(p.a) + '</b>' + (p.t.length > 1 ? '<ul>' + p.t.map((t, k) => '<li>' + tavle(p, k) + '</li>').join('') + '</ul>' : tavle(p, 0)) +
    (p.x ? '<div class="approx">Placering omtrentlig</div>' : '') +
    '<div style="margin-top:6px"><a href="' + SRC + '" target="_blank" rel="noopener">Københavns Biblioteker</a> · <a href="https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lon + '" target="_blank" rel="noopener">Rute</a></div>', { maxWidth: 340, maxHeight: 360 });
  p.m.on('click', () => mark(i, false));
});
const sel = document.getElementById('d');
[...new Set(DATA.map(p => p.d))].forEach(d => { const o = document.createElement('option'); o.textContent = d; sel.appendChild(o); });
const list = document.getElementById('list'), q = document.getElementById('q'), cw = document.getElementById('cw'), co = document.getElementById('co');
function mark(i, open) {
  document.querySelectorAll('.item.on').forEach(e => e.classList.remove('on'));
  const el = document.querySelector('.item[data-i="' + i + '"]');
  if (el) { el.classList.add('on'); if (!open) el.scrollIntoView({ block: 'nearest' }); }
  if (open) { const p = DATA[i]; map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16)); p.m.openPopup(); }
}
function render(fit) {
  const term = q.value.trim().toLowerCase(), d = sel.value;
  const vis = DATA.filter(p => (!d || p.d === d) && (!term || p.s.includes(term)) && (p.w ? cw.checked : co.checked));
  DATA.forEach(p => map.removeLayer(p.m));
  vis.forEach(p => p.m.addTo(map));
  let h = '', cur = '';
  vis.forEach(p => {
    if (p.d !== cur) { cur = p.d; h += '<div class="grp">' + esc(cur) + '</div>'; }
    h += '<div class="item" data-i="' + p.i + '"><span class="dot" style="background:' + color(p) + '"></span><div><div class="addr">' + esc(p.a) + '</div>' +
      p.t.map(t => '<div class="txt">' + esc(t) + '</div>').join('') + (p.x ? '<div class="approx">Placering omtrentlig</div>' : '') + '</div></div>';
  });
  list.innerHTML = h || '<div class="item">Ingen tavler matcher.</div>';
  document.getElementById('count').textContent = vis.reduce((n, p) => n + p.t.length, 0) + ' tavler på ' + vis.length + ' steder vist';
  if (fit && vis.length) map.fitBounds(L.latLngBounds(vis.map(p => [p.lat, p.lon])).pad(.08), { maxZoom: 16 });
}
list.addEventListener('click', e => { const it = e.target.closest('.item[data-i]'); if (it) mark(+it.dataset.i, true); });
q.addEventListener('input', () => render(false));
sel.addEventListener('change', () => render(true));
cw.addEventListener('change', () => render(false));
co.addEventListener('change', () => render(false));
const side = document.getElementById('side'), tg = document.getElementById('toggle');
tg.addEventListener('click', () => { side.classList.toggle('min'); tg.textContent = side.classList.contains('min') ? 'Vis liste' : 'Skjul liste'; setTimeout(() => map.invalidateSize(), 50); });
render(true);
</script>
</body>
</html>
